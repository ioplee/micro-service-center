version: '3.8'

services:
  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=api-gateway
      - SERVICE_VERSION=1.0.0
      - SERVICE_PORT=8000
      - DEBUG=true
    depends_on:
      - database-service
      - vector-db-service
      - llm-service
    networks:
      - microservice-network
    restart: unless-stopped

  # Database Service
  database-service:
    build:
      context: .
      dockerfile: ./services/database-service/Dockerfile
    container_name: database-service
    ports:
      - "8001:8001"
    environment:
      - SERVICE_NAME=database-service
      - SERVICE_VERSION=1.0.0
      - SERVICE_PORT=8001
      - DEBUG=true
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=secret
      - MYSQL_DB=app
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=app
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DB=app
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - mysql
      - postgres
      - mongodb
      - redis
    networks:
      - microservice-network
    restart: unless-stopped

  # Vector Database Service
  vector-db-service:
    build:
      context: .
      dockerfile: ./services/vector-db-service/Dockerfile
    container_name: vector-db-service
    ports:
      - "8002:8002"
    environment:
      - SERVICE_NAME=vector-db-service
      - SERVICE_VERSION=1.0.0
      - SERVICE_PORT=8002
      - DEBUG=true
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - CHROMADB_PATH=/data/chromadb
    volumes:
      - chromadb-data:/data/chromadb
    depends_on:
      - qdrant
      - milvus
    networks:
      - microservice-network
    restart: unless-stopped

  # LLM Service
  llm-service:
    build:
      context: .
      dockerfile: ./services/llm-service/Dockerfile
    container_name: llm-service
    ports:
      - "8003:8003"
    environment:
      - SERVICE_NAME=llm-service
      - SERVICE_VERSION=1.0.0
      - SERVICE_PORT=8003
      - DEBUG=true
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
    networks:
      - microservice-network
    restart: unless-stopped

  # Example Business Service
  example-service:
    build:
      context: .
      dockerfile: ./business/example-service/Dockerfile
    container_name: example-service
    ports:
      - "8010:8010"
    environment:
      - SERVICE_NAME=example-service
      - SERVICE_VERSION=1.0.0
      - SERVICE_PORT=8010
      - DEBUG=true
    depends_on:
      - database-service
      - vector-db-service
      - llm-service
    networks:
      - microservice-network
    restart: unless-stopped

  # MySQL
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=app
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - microservice-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=secret
      - POSTGRES_DB=app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - microservice-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=app
    volumes:
      - mongodb-data:/data/db
    networks:
      - microservice-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - microservice-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Qdrant
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - microservice-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Milvus
  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    networks:
      - microservice-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ETCD (for Milvus)
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - microservice-network
    restart: unless-stopped

  # MinIO (for Milvus)
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: minio
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - microservice-network
    restart: unless-stopped

volumes:
  mysql-data:
  postgres-data:
  mongodb-data:
  redis-data:
  qdrant-data:
  milvus-data:
  etcd-data:
  minio-data:
  chromadb-data:

networks:
  microservice-network:
    driver: bridge
